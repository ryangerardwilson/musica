schema: spec-driven

context: |
  musica is a Go terminal music player. The command is musica.
  Playback reads a local music directory. Download jobs and the saved
  music directory live in musica's own sqlite file. nebula keep backs that
  file up at s3://backups/musica.sqlite. Audio files stay in the music
  directory. Config stays at ~/.config/musica/config.json.

rules:
  proposal:
    - State the operator problem, outcome, scope, and non-goals.
  specs:
    - Use SHALL or MUST and concrete GIVEN/WHEN/THEN scenarios.
  tasks:
    - Include strict OpenSpec validation and the relevant Go tests.
    - Mark a task complete only after the check has been run.
